  <text x="32" y="268" fill="#a3abbd" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.12em">APPEARANCE &amp; VOICE</text>
  <rect x="24" y="284" width="342" height="56" rx="16" fill="rgba(11,13,19,0.88)" stroke="rgba(179,202,255,0.08)"/>
