<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 780" fill="none" aria-hidden="true">
  <title>Illustrative subscription screen (sample data)</title>
  <rect width="390" height="780" rx="36" fill="#0a0d14"/>
  <rect x="1" y="1" width="388" height="778" rx="35" stroke="rgba(179,202,255,0.12)" stroke-width="2"/>
  <!-- status -->
  <text x="195" y="44" text-anchor="middle" fill="#8b93a8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">9:41</text>
  <!-- header -->
  <text x="32" y="108" fill="#f7f7fb" font-family="Georgia, 'Iowan Old Style', serif" font-size="28" font-weight="600">Subscription</text>
  <rect x="286" y="84" width="72" height="36" rx="18" fill="rgba(35,123,255,0.2)" stroke="rgba(35,123,255,0.35)"/>
  <text x="322" y="107" text-anchor="middle" fill="#9ec5ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Done</text>
  <!-- plan card -->
  <rect x="24" y="148" width="342" height="168" rx="22" fill="rgba(15,19,29,0.95)" stroke="rgba(179,202,255,0.14)"/>
  <circle cx="48" cy="182" r="5" fill="#3dd68c"/>
  <text x="62" y="188" fill="#b8e9c9" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em">ACTIVE</text>
  <text x="40" y="228" fill="#f7f7fb" font-family="Georgia, serif" font-size="22" font-weight="600">Selara Pinnacle</text>
  <text x="40" y="258" fill="#5b9bff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">$110/month</text>
  <text x="40" y="290" fill="#8b93a8" font-family="system-ui, sans-serif" font-size="13">Sample renewal: Jan 15, 2027</text>
  <!-- billing -->
  <text x="32" y="358" fill="#a3abbd" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.12em">BILLING</text>
  <rect x="24" y="374" width="342" height="132" rx="20" fill="rgba(11,13,19,0.88)" stroke="rgba(179,202,255,0.1)"/>
  <text x="40" y="408" fill="#8b93a8" font-family="system-ui, sans-serif" font-size="12">Billing email</text>
  <text x="40" y="432" fill="#f7f7fb" font-family="system-ui, sans-serif" font-size="15" font-weight="600">you@example.com</text>
  <line x1="40" y1="448" x2="350" y2="448" stroke="rgba(179,202,255,0.08)"/>
  <text x="40" y="476" fill="#8b93a8" font-family="system-ui, sans-serif" font-size="12">Payment method</text>
  <text x="40" y="498" fill="#f7f7fb" font-family="system-ui, sans-serif" font-size="14">Managed by Stripe</text>
  <!-- portal link -->
  <rect x="24" y="530" width="342" height="52" rx="16" fill="rgba(35,123,255,0.12)" stroke="rgba(35,123,255,0.22)"/>
  <text x="195" y="562" text-anchor="middle" fill="#7eb6ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Open billing portal</text>
  <text x="195" y="620" text-anchor="middle" fill="#5c6578" font-family="system-ui, sans-serif" font-size="11">Illustration only — not your account</text>
</svg>
